name: Deploy to Timeweb

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Copy files to server
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.TIMEWEB_HOST }}
          port: 22
          username: root
          key: ${{ secrets.TIMEWEB_SSH_KEY }}
          source: "."
          target: "/opt/semantic-radar"

      - name: Create .env file on server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.TIMEWEB_HOST }}
          port: 22
          username: root
          key: ${{ secrets.TIMEWEB_SSH_KEY }}
          script: |
            cd /opt/semantic-radar
            cat > .env << 'EOF'
            S3_ENDPOINT=${{ secrets.S3_ENDPOINT }}
            S3_ACCESS_KEY=${{ secrets.S3_ACCESS_KEY }}
            S3_SECRET_KEY=${{ secrets.S3_SECRET_KEY }}
            S3_BUCKET_NAME=${{ secrets.S3_BUCKET_NAME }}
            S3_REGION=${{ secrets.S3_REGION }}
            POSTGRES_USER=storage_user
            POSTGRES_PASSWORD=storage_pass
            POSTGRES_DB=storage_db
            POSTGRES_DSN=postgresql://storage_user:storage_pass@postgres:5432/storage_db
            STORAGE_URL=http://storage:8007
            EOF

      - name: Deploy via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.TIMEWEB_HOST }}
          port: 22
          username: root
          key: ${{ secrets.TIMEWEB_SSH_KEY }}
          script: |
            cd /opt/semantic-radar
            
            # Остановка старых контейнеров
            docker-compose down

            # Скачивание актуальных образов
            docker-compose pull

            # Запуск контейнеров (без пересборки, т.к. образы уже собраны)
            docker-compose up -d

            # Очистка неиспользуемых образов
            docker image prune -f
          timeout: 1800s