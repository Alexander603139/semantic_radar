services:
  embedder:
    build:
      context: .
      dockerfile: services/embedder/Dockerfile
    container_name: embedder
    restart: unless-stopped
    ports:
      - "8004:8002"
    volumes:
      - ./data:/app/data
      - ./models:/app/models
    environment:
      MODEL_NAME: /app/models/all-MiniLM-L6-v2
      VECTORS_ROOT: /app/data/vectors
      PORT: 8002
    networks:
      - semantic-net

  ingestor:
    build:
      context: .
      dockerfile: services/ingestor/Dockerfile
    container_name: ingestor
    restart: unless-stopped
    ports:
      - "8003:8001"
    volumes:
      - ./data:/app/data
    environment:
      EMBEDDER_URL: http://embedder:8002/embed
      EMBEDDER_MOCK: "False"
      PORT: 8001
      SCHEDULE_CRON: "0 5 * * *"
    depends_on:
      - embedder
    networks:
      - semantic-net

  analyzer:
    build:
      context: .
      dockerfile: services/analyzer/Dockerfile
    container_name: analyzer
    restart: unless-stopped
    ports:
      - "8005:8004"
    volumes:
      - ./data:/app/data
    environment:
      VECTORS_ROOT: /app/data/vectors
      CLUSTERS_ROOT: /app/data/clusters
      PORT: 8004
    networks:
      - semantic-net

  reporter:
    build:
      context: .
      dockerfile: services/reporter/Dockerfile
    container_name: reporter
    restart: unless-stopped
    ports:
      - "8006:8005"
    volumes:
      - ./data:/app/data
    environment:
      REPORTS_ROOT: /app/data/reports
      PORT: 8005
      PLOTLY_TEMPLATE: plotly_white
      STORAGE_URL: http://storage:8007
    depends_on:
      - storage                          # <-- добавлено (опционально)
    networks:
      - semantic-net

  postgres:
    image: postgres:15-alpine
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-storage_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-storage_pass}
      POSTGRES_DB: ${POSTGRES_DB:-storage_db}
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - semantic-net

  storage:
    build:
      context: .
      dockerfile: services/storage/Dockerfile
    container_name: storage
    restart: unless-stopped
    ports:
      - "8007:8007"
    environment:
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME}
      S3_REGION: ${S3_REGION:-ru-1}
      POSTGRES_DSN: ${POSTGRES_DSN}
      STORAGE_PORT: 8007
    depends_on:
      - postgres
    networks:
      - semantic-net
      
  traffic_stats:
    build:
      context: .
      dockerfile: services/traffic_stats/Dockerfile
    container_name: traffic_stats
    restart: unless-stopped
    ports:
      - "8008:8000"
    environment:
      OPR_API_KEY: ${OPR_API_KEY}
      OPR_BASE_URL: https://openpagerank.keywordseverywhere.com/v1/domains/bulk
      OPR_TIMEOUT: 30
      STORAGE_SERVICE_URL: http://storage:8007
      PORT: 8000
    depends_on:
      - storage
    networks:
      - semantic-net

networks:
  semantic-net:
    driver: bridge